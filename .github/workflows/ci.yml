name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege for the workflow token (read only). Deploy jobs get their own scopes later.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: libraqm (Hindi shaping, same as the deploy image)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libraqm0
      - run: pip install -r requirements-dev.txt
      - name: lint
        run: ruff check .
      - name: format
        run: ruff format --check .
      - name: typecheck
        run: mypy app tests
      - name: tests (coverage gate 85%)
        run: pytest
      - name: dependency vulnerabilities
        run: pip-audit -r requirements.txt

  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rules-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21" # firebase-tools 15 needs Java 21+
      - run: npm ci
      - name: rules tests on emulator (demo project, no cloud access)
        run: npx firebase emulators:exec --only firestore --project demo-proofcard --config ../firebase.json "npm test"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - name: typecheck + build
        run: npm run build
      - name: tests
        run: npm test
      - name: dependency vulnerabilities (prod deps)
        run: npm audit --omit=dev --audit-level=high
